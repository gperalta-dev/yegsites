<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Open in Messages | Southsites</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap">
<style>
  /* Jan's outreach list links here: the artifact can't open Messages itself, a normal page can.
     the number and text ride in the #fragment, which never reaches the server */
  :root { --bg: #eceef1; --card: #fff; --fg: #12151a; --muted: #5b616b; --accent: #ffc83d; --accent-ink: #1a1405; --soft: #f3f4f2; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1013; --card: #181b20; --fg: #f1efe8; --muted: #a3a8b1; --soft: #20242a; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 500 16px/1.45 "Figtree", system-ui, sans-serif;
         padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.1; font-weight: 800; }
  p { margin: 0; color: var(--muted); }
  .go { display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
        font-size: 18px; font-weight: 800; text-decoration: none; }
  .to { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
  .text { background: var(--card); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; color: var(--fg); font-size: 15px; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening Messages</h1>
  <p id="line">To <span class="to" id="to"></span>. If Messages didn't open, tap the button.</p>
  <a class="go" id="go" href="#">Open in Messages</a>
  <p class="text" id="text"></p>
  <p>When it's sent, go back to the list and tick the shop.</p>
</main>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const to = (q.get('to') || '').replace(/[^\d+]/g, ''), body = (q.get('body') || '').slice(0, 2000);
  const go = document.getElementById('go');
  if (!/^\+?\d{10,15}$/.test(to)) {
    document.getElementById('h').textContent = 'No number in this link';
    document.getElementById('line').textContent = 'Open it again from the outreach list.';
    go.hidden = true;
  } else {
    // iPhone reads sms:NUMBER&body=, Android sms:NUMBER?body=
    go.href = `sms:${to}${/iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(body)}`;
    document.getElementById('to').textContent = to.replace(/^\+1(\d{3})(\d{3})(\d{4})$/, '($1) $2-$3');
    document.getElementById('text').textContent = body;
    location.href = go.href;
  }
</script>
</body>
</html>
